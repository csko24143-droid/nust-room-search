name: GA4サイト分析を記録

on:
  # 自動実行(スケジュール)は停止中。GA4シークレット(GA4_PROPERTY_ID / GA4_SA_KEY)が
  # 未設定で毎回失敗していたため、cronを無効化。手動実行のみ残す。
  # シークレットを設定したら、下のscheduleブロックを復活させれば自動実行が戻る。
  workflow_dispatch:
  # schedule:
  #   # 週2回 月・木 JST 09:10 (UTC 00:10) に実行
  #   - cron: "10 0 * * 1,4"

permissions:
  contents: write

jobs:
  ga4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-analytics-data

      - name: Fetch GA4 metrics
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SA_KEY: ${{ secrets.GA4_SA_KEY }}
        run: python scripts/fetch_ga4_metrics.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ga4_history.json data/ga4_breakdown.json
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: GA4サイト分析を更新 ($(date -u +%Y-%m-%d))"
            git push
          fi

name: Instagramインサイトを記録

on:
  # 自動実行(スケジュール)は中止。IG_ACCESS_TOKENが8/13に失効し、
  # 以降の実行が全て失敗していたため運用をやめた。手動実行のみ残す。
  workflow_dispatch:
  # schedule:
  #   # 週2回 月・木 JST 09:00 (UTC 00:00) に実行
  #   - cron: "0 0 * * 1,4"

permissions:
  contents: write

jobs:
  insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Instagram insights
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
        run: python scripts/fetch_instagram_insights.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/instagram_history.json data/instagram_posts.json
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: Instagramインサイトを更新 ($(date -u +%Y-%m-%d))"
            git push
          fi
